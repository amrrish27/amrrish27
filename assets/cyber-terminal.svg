<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">Amrrish Roshan cybersecurity terminal</title>
<desc id="desc">A polished Kali-inspired terminal profile showing web security, full stack, AI agents and CTF work.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#070b12"/><stop offset="0.55" stop-color="#0b111b"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#00ff9d"/><stop offset="1" stop-color="#00d9ff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#173047" stroke-width="1" opacity=".38"/></pattern>
</defs>
