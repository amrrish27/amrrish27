<text x="900" y="132" fill="#00ff9d" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">[ terminal::session ]</text>
<text x="900" y="170" fill="#718096" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">$ uname -a</text>
<text x="900" y="194" fill="#d7e2ee" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">Kali Linux  •  x86_64  •  security-lab</text>
<text x="900" y="230" fill="#718096" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">$ ls ~/toolbox</text>
<text x="900" y="254" fill="#d7e2ee" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">nmap  burp  ffuf  wireshark</text>
<text x="900" y="276" fill="#d7e2ee" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">python  git  docker  node</text>
<text x="900" y="312" fill="#718096" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">$ printf '%s\n' "current-mode"</text>
