<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" role="img" aria-labelledby="t d"><title id="t">Amrrish Roshan technology loadout</title><desc id="d">Animated black, cream gold and crimson technology command center with a mascot crest connecting every domain.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020202"/><stop offset=".55" stop-color="#171108"/><stop offset="1" stop-color="#070303"/></linearGradient><linearGradient id="gold" x1="0" x2="1"><stop stop-color="#8A641B"/><stop offset=".45" stop-color="#F2D27A"><animate attributeName="stop-color" values="#D4AF37;#FFF0B0;#D4AF37" dur="5s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#8A641B"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#D4AF37" stroke-opacity=".045"/></pattern></defs><rect width="1400" height="470" rx="28" fill="url(#bg)"/><rect width="1400" height="470" rx="28" fill="url(#grid)"/><rect x="18" y="18" width="1364" height="434" rx="22" fill="#060606" fill-opacity=".92" stroke="url(#gold)" stroke-opacity=".48"/><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><rect x="18" y="18" width="1364" height="52" rx="22" fill="#11100C"/><circle cx="46" cy="44" r="6" fill="#8B1E1E"/><circle cx="67" cy="44" r="6" fill="#D4AF37"/><circle cx="88" cy="44" r="6" fill="#F0D27A"/><text x="120" y="49" fill="#B9AA8A" font-size="12">amrrish@dev: ~/loadout</text><text x="700" y="49" text-anchor="middle" fill="#F0D27A" font-size="11" letter-spacing="2">TECHNOLOGY LOADOUT / CORE SYSTEM</text><text x="1350" y="49" text-anchor="end" fill="#E8D28A" font-size="10">08 DOMAINS</text><text x="44" y="101" fill="#D4AF37" font-size="12">$ ./loadout --live --map-core</text><text x="1352" y="101" text-anchor="end" fill="#766D60" font-size="10">status: synchronized</text>
<!-- domain cards --> <g><rect x="44" y="126" width="360" height="270" rx="18" fill="#090807" stroke="#D4AF37" stroke-opacity=".34"/><text x="70" y="158" fill="#F0D27A" font-size="10" letter-spacing="2">ENGINEERING</text><g><rect x="70" y="180" width="145" height="76" rx="12" fill="#0D0C09" stroke="#D4AF37" stroke-opacity=".45"/><text x="86" y="205" fill="#D4AF37" font-size="10">FRONTEND</text><text x="86" y="230" fill="#FFF3C4" font-size="14" font-weight="700">React · Next.js</text><text x="86" y="248" fill="#897E6A" font-size="9">Vite · Tailwind</text></g><g><rect x="227" y="180" width="151" height="76" rx="12" fill="#0D0C09" stroke="#D4AF37" stroke-opacity=".45"/><text x="243" y="205" fill="#D4AF37" font-size="10">BACKEND</text><text x="243" y="230" fill="#FFF3C4" font-size="14" font-weight="700">Node · Python</text><text x="243" y="248" fill="#897E6A" font-size="9">Express · FastAPI</text></g><g><rect x="70" y="272" width="145" height="76" rx="12" fill="#0D0C09" stroke="#8B1E1E" stroke-opacity=".58"/><text x="86" y="297" fill="#D89A9A" font-size="10">DATA</text><text x="86" y="322" fill="#FFF3C4" font-size="14" font-weight="700">MongoDB · MySQL</text><text x="86" y="340" fill="#897E6A" font-size="9">Firebase · Supabase</text></g><g><rect x="227" y="272" width="151" height="76" rx="12" fill="#0D0C09" stroke="#D4AF37" stroke-opacity=".45"/><text x="243" y="297" fill="#D4AF37" font-size="10">DELIVERY</text><text x="243" y="322" fill="#FFF3C4" font-size="14" font-weight="700">Git · Docker · AWS</text><text x="243" y="340" fill="#897E6A" font-size="9">deploy · automate</text></g></g>
<!-- center mascot --> <g transform="translate(490 121)"><circle cx="210" cy="135" r="120" fill="#0A0907" stroke="url(#gold)" stroke-width="2" opacity=".8"/><circle cx="210" cy="135" r="96" fill="none" stroke="#8B1E1E" stroke-opacity=".34" stroke-dasharray="5 9"><animateTransform attributeName="transform" type="rotate" from="0 210 135" to="360 210 135" dur="20s" repeatCount="indefinite"/></circle><g transform="translate(95 16) scale(.64)"><path d="M75 84C38 51 16 49 0 63C18 92 43 109 67 115C50 140 46 163 60 185C80 171 95 151 100 132C118 142 136 165 132 192C152 182 168 166 180 143C192 166 208 182 228 192C224 165 242 142 260 132C265 151 280 171 300 185C314 163 310 140 293 115C317 109 342 92 360 63C344 49 322 51 285 84C266 70 240 61 180 61C120 61 94 70 75 84Z" fill="#0E0D0A" stroke="url(#gold)" stroke-width="5"/><path d="M100 109C112 79 143 66 180 66C217 66 248 79 260 109L242 154C228 180 205 197 180 218C155 197 132 180 118 154Z" fill="#050505" stroke="#F0D27A" stroke-width="4"/><path d="M128 111L103 98M232 111L257 98" stroke="#F0D27A" stroke-width="7" stroke-linecap="round"/><path d="M153 166L180 184L207 166" fill="none" stroke="#8B1E1E" stroke-width="5" stroke-linecap="round"/><path d="M180 75V40" stroke="#F0D27A" stroke-width="4"/><path d="M165 38L180 21L195 38L180 54Z" fill="#F0D27A"/><circle cx="133" cy="124" r="7" fill="#B53027" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle><circle cx="227" cy="124" r="7" fill="#B53027" filter="url(#glow)"/></g><text x="210" y="258" text-anchor="middle" fill="#F0D27A" font-size="10" letter-spacing="3">CORE IDENTITY</text><text x="210" y="278" text-anchor="middle" fill="#8A806E" font-size="9">every tool feeds the same engine</text></g>
<!-- right modules --> <g transform="translate(1002 126)"><rect width="354" height="270" rx="18" fill="#090807" stroke="#D4AF37" stroke-opacity=".34"/><text x="26" y="32" fill="#F0D27A" font-size="10" letter-spacing="2">INTELLIGENCE / RUNTIME</text><g><rect x="26" y="52" width="302" height="52" rx="11" fill="#0D0C09" stroke="#D4AF37" stroke-opacity=".35"/><text x="42" y="74" fill="#D4AF37" font-size="9">AI</text><text x="85" y="74" fill="#FFF3C4" font-size="13" font-weight="700">AI Agents · LLMs · Gemini</text><text x="42" y="92" fill="#897E6A" font-size="9">automation · intelligent workflows</text></g><g><rect x="26" y="116" width="302" height="52" rx="11" fill="#0D0C09" stroke="#8B1E1E" stroke-opacity=".5"/><text x="42" y="138" fill="#D89A9A" font-size="9">LANG</text><text x="85" y="138" fill="#FFF3C4" font-size="13" font-weight="700">TypeScript · JavaScript · C/C++</text><text x="42" y="156" fill="#897E6A" font-size="9">logic · systems · scripting</text></g><g><rect x="26" y="180" width="302" height="52" rx="11" fill="#0D0C09" stroke="#D4AF37" stroke-opacity=".35"/><text x="42" y="202" fill="#D4AF37" font-size="9">RUN</text><text x="85" y="202" fill="#FFF3C4" font-size="13" font-weight="700">Linux · Bash · Terminal</text><text x="42" y="220" fill="#897E6A" font-size="9">local workflows · developer tooling</text></g><g><rect x="26" y="244" width="302" height="0"/></g></g>
<!-- connectors --> <g fill="none" stroke="url(#gold)" stroke-width="2" opacity=".62"><path d="M404 220H490"/><path d="M910 220H1002"/></g><circle cx="450" cy="220" r="4" fill="#D4AF37" filter="url(#glow)"><animate attributeName="r" values="3;7;3" dur="1.5s" repeatCount="indefinite"/></circle><circle cx="955" cy="220" r="4" fill="#8B1E1E" filter="url(#glow)"/><path d="M44 424H1356" stroke="url(#gold)" stroke-opacity=".5"><animate attributeName="stroke-dasharray" values="0 1300;650 650;1300 0" dur="6s" repeatCount="indefinite"/></path><text x="44" y="444" fill="#6F6558" font-size="9" letter-spacing="2">AMRRISH / LOADOUT / CORE SYSTEM</text><text x="1356" y="444" text-anchor="end" fill="#D4AF37" font-size="9"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>● READY</text></g></svg>