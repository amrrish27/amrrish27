  <text x="70" y="252" fill="#8b5cf6" font-size="12">02  BACKEND</text>
  <text x="70" y="283" fill="#00e5ff" font-size="12">03  DATA</text>
  <text x="70" y="314" fill="#00ff9d" font-size="12">04  DEVOPS</text>
