<text x="48" y="108" fill="#D4AF37" font-size="13">$ ./loadout --scan</text><text x="1350" y="108" text-anchor="end" fill="#766D60" font-size="11">runtime: online</text>
<rect x="48" y="132" width="1304" height="326" rx="18" fill="#090807" stroke="#332919"/>
<g fill="#B9AF9E" font-size="12"><text x="72" y="165" fill="#D4AF37" letter-spacing="2">CORE STACK</text><text x="72" y="194">FRONTEND</text><text x="72" y="222" fill="#E2D7C6">React · Next.js · Vite</text><text x="72" y="258">BACKEND</text><text x="72" y="286" fill="#E2D7C6">Node · Express · Python · FastAPI</text><text x="72" y="322">DATA</text><text x="72" y="350" fill="#E2D7C6">MongoDB · MySQL · Firebase</text><text x="72" y="386">AI / CLOUD</text><text x="72" y="414" fill="#E2D7C6">AI agents · Gemini · Docker · AWS</text></g>
