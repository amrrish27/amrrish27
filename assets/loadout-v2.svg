<linearGradient id="gold" x1="0" x2="1"><stop stop-color="#8A6A1F"/><stop offset=".5" stop-color="#D4AF37"><animate attributeName="stop-color" values="#D4AF37;#FFE08A;#D4AF37" dur="5s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#8A6A1F"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#D4AF37" stroke-opacity=".05"/></pattern>
<filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="520" rx="28" fill="url(#bg)"/><rect width="1400" height="520" rx="28" fill="url(#grid)"/><rect x="20" y="20" width="1360" height="480" rx="22" fill="#060606" fill-opacity=".92" stroke="url(#gold)" stroke-opacity=".5"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
