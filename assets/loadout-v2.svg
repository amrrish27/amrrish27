    <g transform="translate(819 138)"><rect width="255" height="118" rx="14" fill="#0b111b" stroke="#ec4899" stroke-opacity=".30"/><path d="M18 18h28l10 10v32H18z" fill="#1e0d18" stroke="#ec4899" stroke-opacity=".55"/><text x="32" y="50" text-anchor="middle" fill="#f9a8d4" font-size="11" font-weight="700">UI</text><text x="68" y="32" fill="#f9a8d4" font-size="10" letter-spacing="1.5">DESIGN</text><text x="68" y="54" fill="#f8fafc" font-size="16" font-weight="700">Tailwind · Vite</text><text x="68" y="77" fill="#94a3b8" font-size="11">responsive interfaces</text><text x="18" y="102" fill="#334155" font-size="9">MODULE_08</text></g>
