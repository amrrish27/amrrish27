<g><rect x="0" y="0" width="270" height="82" rx="12" fill="#0C0A07" stroke="#D4AF37" stroke-opacity=".35"/><text x="22" y="27" fill="#D4AF37" font-size="10" letter-spacing="2">01 / BUILD</text><text x="22" y="53" fill="#F5F1E8" font-size="17" font-weight="700">React · Node · Python</text><circle cx="242" cy="25" r="4" fill="#D4AF37" filter="url(#g)"><animate attributeName="r" values="3;7;3" dur="1.6s" repeatCount="indefinite"/></circle></g>
<g transform="translate(290 0)"><rect width="270" height="82" rx="12" fill="#0C0A07" stroke="#B99A4A" stroke-opacity=".42"/><text x="22" y="27" fill="#E6CE7A" font-size="10" letter-spacing="2">02 / INTELLIGENCE</text><text x="22" y="53" fill="#F5F1E8" font-size="17" font-weight="700">AI Agents · LLMs</text><circle cx="242" cy="25" r="4" fill="#E6CE7A"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle></g>
<g transform="translate(0 102)"><rect width="270" height="82" rx="12" fill="#0C0A07" stroke="#8B1E1E" stroke-opacity=".6"/><text x="22" y="27" fill="#D89A9A" font-size="10" letter-spacing="2">03 / DATA</text><text x="22" y="53" fill="#F5F1E8" font-size="17" font-weight="700">MongoDB · MySQL</text></g>
<g transform="translate(290 102)"><rect width="270" height="82" rx="12" fill="#0C0A07" stroke="#D4AF37" stroke-opacity=".3"/><text x="22" y="27" fill="#D4AF37" font-size="10" letter-spacing="2">04 / DELIVERY</text><text x="22" y="53" fill="#F5F1E8" font-size="17" font-weight="700">Git · Docker · AWS</text></g>
