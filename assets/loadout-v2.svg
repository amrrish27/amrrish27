<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="t d">
<title id="t">Amrrish Roshan — technology loadout</title><desc id="d">Animated black, gold and crimson technology command center.</desc>
<defs>
