<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="t d">
<title id="t">Amrrish Roshan — technology loadout</title>
<desc id="d">A compact animated cyberpunk technology command center showing core engineering tools.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".48" stop-color="#0b1020"/><stop offset="1" stop-color="#190823"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#00f5ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff3cac"/></linearGradient>
  <linearGradient id="pulse" x1="0" x2="1"><stop stop-color="#00ff9d"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#6ee7ff" stroke-opacity=".055"/></pattern>
  <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 5.5H1400" stroke="#fff" stroke-opacity=".018"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1400" height="520" rx="28" fill="url(#bg)"/>
<rect width="1400" height="520" rx="28" fill="url(#grid)"/>
<rect width="1400" height="520" rx="28" fill="url(#scan)"/>
<circle cx="1240" cy="100" r="120" fill="#8b5cf6" opacity=".08" filter="url(#soft)"><animate attributeName="r" values="100;140;100" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="160" cy="430" r="110" fill="#00e5ff" opacity=".06" filter="url(#soft)"><animate attributeName="r" values="90;125;90" dur="6s" repeatCount="indefinite"/></circle>
<rect x="20" y="20" width="1360" height="480" rx="22" fill="#060a12" fill-opacity=".86" stroke="url(#edge)" stroke-opacity=".48"/>

