<g transform="translate(700 270)"><path d="M0-126A126 126 0 0 1 89-89" fill="none" stroke="#F2D27A" stroke-width="6" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/></path></g>
<circle cx="700" cy="124" r="5" fill="#D4AF37" filter="url(#glow)"><animate attributeName="r" values="3;9;3" dur="1.2s" repeatCount="indefinite"/></circle>
<path d="M700 112V88M688 100L700 88L712 100" stroke="#F2D27A" stroke-width="3" fill="none"/>
<text x="700" y="414" text-anchor="middle" fill="#806F50" font-size="9" letter-spacing="3">KALI / SYSTEM CORE / ONLINE</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".45s" begin="2.8s" fill="freeze"/><text x="548" y="82" fill="#D4AF37" font-size="10" letter-spacing="3">LIVE PROCESS</text><text x="548" y="106" fill="#F5F1E8" font-size="13">terminal → build → ship</text><line x1="548" y1="120" x2="852" y2="120" stroke="#3A2C12"/><text x="548" y="150" fill="#B99A4A" font-size="11">kernel</text><text x="635" y="150" fill="#F5F1E8" font-size="11">ready</text><text x="548" y="174" fill="#B99A4A" font-size="11">workspace</text><text x="635" y="174" fill="#F5F1E8" font-size="11">mounted</text><text x="548" y="198" fill="#B99A4A" font-size="11">session</text><text x="635" y="198" fill="#D4AF37" font-size="11">active</text></g>
</g></svg>