<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="Amrrish Roshan Kali command console">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset=".6" stop-color="#171108"/><stop offset="1" stop-color="#070303"/></linearGradient>
<radialGradient id="core"><stop stop-color="#3A2B0E"/><stop offset=".52" stop-color="#0D0A06"/><stop offset="1" stop-color="#020202"/></radialGradient>
<linearGradient id="gold" x1="0" x2="1"><stop stop-color="#7A5718"/><stop offset=".5" stop-color="#F2D27A"><animate attributeName="stop-color" values="#D4AF37;#FFF0B0;#D4AF37" dur="3.8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#9D7423"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#D4AF37" opacity=".03"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="898" height="458" rx="16" fill="url(#bg)" stroke="#3A2C12" stroke-width="1.5"/>
<rect x="1" y="1" width="898" height="44" rx="16" fill="#0D0C0A"/><rect x="1" y="31" width="898" height="14" fill="#0D0C0A"/><line x1="1" y1="45" x2="899" y2="45" stroke="#3A2C12"/>
<circle cx="24" cy="23" r="6" fill="#8B1E1E"/><circle cx="44" cy="23" r="6" fill="#D4AF37"/><circle cx="64" cy="23" r="6" fill="#F2D27A"/>
<text x="450" y="28" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#9B8E76">amrrish27@kali: ~/console — zsh</text>
<rect x="2" y="46" width="896" height="412" fill="url(#scan)"/>

<g font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code',Consolas,monospace">
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin=".15s" fill="freeze"/>
    <text x="28" y="78" font-size="15"><tspan fill="#D4AF37" font-weight="700">amrrish27@kali</tspan><tspan fill="#706653">:</tspan><tspan fill="#B99A4A">~</tspan><tspan fill="#706653">$ </tspan><tspan fill="#F5F1E8">uname -a</tspan></text>
    <text x="28" y="100" font-size="12" fill="#8F8778">Linux kali-amrrish 6.x x86_64 GNU/Linux</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin=".55s" fill="freeze"/>
    <text x="28" y="128" font-size="15"><tspan fill="#D4AF37" font-weight="700">amrrish27@kali</tspan><tspan fill="#706653">:</tspan><tspan fill="#B99A4A">~</tspan><tspan fill="#706653">$ </tspan><tspan fill="#F5F1E8">pwd</tspan></text>
    <text x="28" y="150" font-size="12" fill="#E7E1D6">/home/amrrish27/workspace</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin=".95s" fill="freeze"/>
    <text x="28" y="178" font-size="15"><tspan fill="#D4AF37" font-weight="700">amrrish27@kali</tspan><tspan fill="#706653">:</tspan><tspan fill="#B99A4A">~/workspace</tspan><tspan fill="#706653">$ </tspan><tspan fill="#F5F1E8">ls -lah ~/projects</tspan></text>
    <text x="28" y="200" font-size="12" fill="#E7E1D6">FounderFlow   Ratefluencer   SelloraAI</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin="1.35s" fill="freeze"/>
    <text x="28" y="228" font-size="15"><tspan fill="#D4AF37" font-weight="700">amrrish27@kali</tspan><tspan fill="#706653">:</tspan><tspan fill="#B99A4A">~/workspace</tspan><tspan fill="#706653">$ </tspan><tspan fill="#F5F1E8">git status --short</tspan></text>
    <text x="28" y="250" font-size="12" fill="#D4AF37">working tree clean</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin="1.75s" fill="freeze"/>
    <text x="28" y="278" font-size="15"><tspan fill="#D4AF37" font-weight="700">amrrish27@kali</tspan><tspan fill="#706653">:</tspan><tspan fill="#B99A4A">~/workspace</tspan><tspan fill="#706653">$ </tspan><tspan fill="#F5F1E8">whoami</tspan></text>
    <text x="28" y="300" font-size="12" fill="#E7E1D6">amrrish27</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".45s" begin="2.2s" fill="freeze"/>
    <rect x="24" y="322" width="500" height="98" rx="15" fill="#080808" stroke="#5A4216"/>
    <text x="42" y="347" fill="#F2D27A" font-size="11" letter-spacing="2">$ fastfetch --minimal</text>
    <text x="42" y="375" fill="#F8F3E8" font-size="23" font-weight="700">AMRRISH ROSHAN</text>
    <text x="42" y="396" fill="#A79C89" font-size="11">OS: KALI LINUX   ·   SHELL: ZSH   ·   SESSION: ACTIVE</text>
    <text x="42" y="414" fill="#D4AF37" font-size="10">BUILD TARGET: WEB / AI / BACKEND</text>
  </g>

  <g>
    <circle cx="700" cy="270" r="158" fill="url(#core)" stroke="#D4AF37" stroke-opacity=".3"/>
    <circle cx="700" cy="270" r="141" fill="none" stroke="#8D6B28" stroke-width="2" stroke-dasharray="5 12"><animateTransform attributeName="transform" type="rotate" from="0 700 270" to="360 700 270" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="270" r="113" fill="#030303" stroke="#4A3410" stroke-opacity=".9"/>
    <image x="658" y="205" width="84" height="130" preserveAspectRatio="xMidYMid meet" href="https://raw.githubusercontent.com/amrrish27/amrrish27/main/assets/pet-full.webp"/>
    <circle cx="700" cy="124" r="5" fill="#D4AF37" filter="url(#glow)"><animate attributeName="r" values="3;9;3" dur="1.2s" repeatCount="indefinite"/></circle>
    <path d="M700 112V88M688 100L700 88L712 100" stroke="#F2D27A" stroke-width="3" fill="none"/>
    <text x="700" y="414" text-anchor="middle" fill="#806F50" font-size="9" letter-spacing="3">KALI / IDENTITY CORE / ONLINE</text>
    <circle cx="700" cy="270" r="96" fill="none" stroke="#D4AF37" stroke-opacity=".12"><animate attributeName="r" values="86;106;86" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".45s" begin="2.55s" fill="freeze"/>
    <text x="548" y="82" fill="#D4AF37" font-size="10" letter-spacing="3">LIVE SHELL</text>
    <text x="548" y="106" fill="#F5F1E8" font-size="12">session@kali:~</text>
    <line x1="548" y1="120" x2="852" y2="120" stroke="#3A2C12"/>
    <text x="548" y="150" fill="#B99A4A" font-size="11">process</text><text x="635" y="150" fill="#F5F1E8" font-size="11">running</text>
    <text x="548" y="174" fill="#B99A4A" font-size="11">projects</text><text x="635" y="174" fill="#F5F1E8" font-size="11">indexed</text>
    <text x="548" y="198" fill="#B99A4A" font-size="11">prompt</text><text x="635" y="198" fill="#D4AF37" font-size="11">ready</text>
    <text x="548" y="224" fill="#D4AF37" font-size="11">$ </text><text x="566" y="224" fill="#F5F1E8" font-size="11">tail -f /var/log/build.log</text>
    <text x="548" y="248" fill="#8A7A5F" font-size="10">waiting for next build...</text>
  </g>
</g>
</svg>