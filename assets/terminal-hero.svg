    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin=".52s" fill="freeze"/><text x="28" y="106" font-size="15"><tspan fill="#6F6658">[*] </tspan><tspan fill="#E7E1D6">initializing command center </tspan><tspan fill="#6F6658">···· </tspan><tspan fill="#D4AF37" font-weight="700">ok</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin=".92s" fill="freeze"/><text x="28" y="134" font-size="15"><tspan fill="#D4AF37">focus </tspan><tspan fill="#6F6658">: </tspan><tspan fill="#E7E1D6">full-stack · AI · backend systems</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin="1.32s" fill="freeze"/><text x="28" y="162" font-size="15"><tspan fill="#D4AF37">mode  </tspan><tspan fill="#6F6658">: </tspan><tspan fill="#E7E1D6">build · automate · ship · iterate</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".35s" begin="1.72s" fill="freeze"/><text x="28" y="190" font-size="15"><tspan fill="#D4AF37">stack </tspan><tspan fill="#6F6658">: </tspan><tspan fill="#E7E1D6">React · Next.js · Node · Python</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".4s" begin="2.12s" fill="freeze"/><text x="28" y="218" font-size="15"><tspan fill="#C89A2B">[+] </tspan><tspan fill="#D4AF37" font-weight="700">session synchronized</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="2.48s" fill="freeze"/>
      <rect x="24" y="252" width="490" height="168" rx="15" fill="#080808" stroke="#5A4216"/>
      <text x="42" y="280" fill="#F2D27A" font-size="11" letter-spacing="2">PROFILE / SIGNAL</text>
      <text x="42" y="318" fill="#F8F3E8" font-size="30" font-weight="700">AMRRISH ROSHAN</text>
      <text x="42" y="345" fill="#A79C89" font-size="12">FULL-STACK DEVELOPER  /  AI BUILDER</text>
      <text x="42" y="368" fill="#A79C89" font-size="12">BACKEND ENGINEER  /  PRODUCT SYSTEMS</text>
      <text x="42" y="398" fill="#D4AF37" font-size="11">$ ./ship <tspan fill="#F5F1E8"><animate attributeName="fill-opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/>READY</tspan></text>
    </g>
    <g>
      <circle cx="700" cy="268" r="156" fill="url(#core)" stroke="#D4AF37" stroke-opacity=".30"/>
      <circle cx="700" cy="268" r="139" fill="none" stroke="#8D6B28" stroke-opacity=".70" stroke-width="2" stroke-dasharray="6 11"><animateTransform attributeName="transform" type="rotate" from="0 700 268" to="360 700 268" dur="18s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="268" r="116" fill="none" stroke="#4A3410" stroke-opacity=".9"/>
      <circle cx="700" cy="268" r="102" fill="#030303" stroke="#C39A3E" stroke-opacity=".30"/>
      <image x="650" y="184" width="100" height="160" preserveAspectRatio="xMidYMid meet" href="https://raw.githubusercontent.com/amrrish27/amrrish27/main/assets/pet-full.webp"/>
      <circle cx="700" cy="126" r="5" fill="#D4AF37" filter="url(#glow)"><animate attributeName="r" values="3;8;3" dur="1.7s" repeatCount="indefinite"/></circle>
      <path d="M700 114V91M688 102L700 90L712 102" stroke="#F2D27A" stroke-width="3" fill="none"/>
      <text x="700" y="405" text-anchor="middle" fill="#806F50" font-size="9" letter-spacing="3">KALI / COMMAND CENTER / ONLINE</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".4s" begin="2.9s" fill="freeze"/>
      <text x="542" y="90" fill="#D4AF37" font-size="10" letter-spacing="3">CORE LINK</text>
      <text x="542" y="112" fill="#E7E1D6" font-size="12">identity → execution</text>
      <line x1="542" y1="124" x2="858" y2="124" stroke="#3A2C12"/>
      <text x="542" y="151" fill="#B99A4A" font-size="11">runtime</text><text x="620" y="151" fill="#F5F1E8" font-size="11">stable</text>
      <text x="542" y="175" fill="#B99A4A" font-size="11">pipeline</text><text x="620" y="175" fill="#F5F1E8" font-size="11">building</text>
      <text x="542" y="199" fill="#B99A4A" font-size="11">release</text><text x="620" y="199" fill="#D4AF37" font-size="11">continuous</text>
