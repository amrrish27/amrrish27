<text x="88" y="450" fill="#D4AF37" font-size="13">$ ./build --fast</text><text x="224" y="450" fill="#F5F1E8" font-size="13"><animate attributeName="opacity" values="1;.3;1" dur="1.1s" repeatCount="indefinite"/>COMPILING ██████████ 100%</text>
