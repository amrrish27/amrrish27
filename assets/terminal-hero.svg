  <text x="450" y="28" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#8D816C">amrrish27@kali: ~/command-center — zsh</text>
  <rect x="2" y="46" width="896" height="412" fill="url(#scan)"/>
