<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc"><title id="title">Amrrish Roshan developer workstation</title><desc id="desc">Animated black, cream-gold and crimson developer workstation with a full-body mascot at the center.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020202"/><stop offset=".55" stop-color="#171208"/><stop offset="1" stop-color="#070303"/></linearGradient><linearGradient id="gold" x1="0" x2="1"><stop stop-color="#8A641B"/><stop offset=".45" stop-color="#F2D27A"><animate attributeName="stop-color" values="#D4AF37;#FFF1B0;#D4AF37" dur="5s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#A57C24"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur stdDeviation="28"/></filter><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D4AF37" stroke-opacity=".05"/></pattern></defs><rect width="1600" height="620" rx="30" fill="url(#bg)"/><rect width="1600" height="620" rx="30" fill="url(#grid)"/><circle cx="790" cy="300" r="250" fill="#D4AF37" opacity=".035" filter="url(#soft)"><animate attributeName="r" values="220;270;220" dur="8s" repeatCount="indefinite"/></circle><rect x="24" y="24" width="1552" height="572" rx="26" fill="#050505" fill-opacity=".9" stroke="url(#gold)" stroke-opacity=".68" stroke-width="2"/><rect x="24" y="24" width="1552" height="52" rx="26" fill="#11100C"/><circle cx="54" cy="50" r="6" fill="#8B1E1E"/><circle cx="75" cy="50" r="6" fill="#D4AF37"/><circle cx="96" cy="50" r="6" fill="#F0D27A"/><g font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><text x="800" y="56" text-anchor="middle" fill="#BBAA77" font-size="14" letter-spacing="3">AMRRISH@DEV :: WORKSTATION</text><text x="60" y="118" fill="#D4AF37" font-size="15">amrrish@dev</text><text x="160" y="118" fill="#6D6251" font-size="15">:</text><text x="174" y="118" fill="#B99A4A" font-size="15">~/workspace</text><text x="278" y="118" fill="#F5F1E8" font-size="15">$ ./whoami</text><text x="60" y="168" fill="#D4AF37" font-size="11" letter-spacing="3">IDENTITY</text><text x="60" y="207" fill="#F8F3E8" font-size="38" font-weight="700" letter-spacing="4">AMRRISH ROSHAN</text><text x="60" y="236" fill="#AAA08E" font-size="13" letter-spacing="1.5">FULL-STACK DEVELOPER  /  AI BUILDER  /  BACKEND ENGINEER</text><path d="M60 254H680" stroke="url(#gold)" stroke-width="2"/><rect x="60" y="280" width="620" height="236" rx="18" fill="#090807" stroke="#D4AF37" stroke-opacity=".22"/><text x="86" y="318" fill="#F0D27A" font-size="13">$ cat ~/.focus</text><text x="86" y="351" fill="#EAE4D9" font-size="14">building intelligent web products</text><text x="86" y="382" fill="#EAE4D9" font-size="14">React · Next.js · Node · Python</text><text x="86" y="413" fill="#EAE4D9" font-size="14">AI agents · APIs · automation · cloud</text><text x="86" y="453" fill="#D4AF37" font-size="13">$ ./build --production</text><text x="250" y="453" fill="#F5F1E8" font-size="13"><animate attributeName="opacity" values="1;.28;1" dur="1.2s" repeatCount="indefinite"/>READY</text><text x="86" y="484" fill="#81786B" font-size="11">learn → build → ship → repeat</text><text x="86" y="510" fill="#B99A4A" font-size="12">$ echo $MODE</text><text x="192" y="510" fill="#F5F1E8" font-size="12">CREATE / ITERATE</text><g transform="translate(705 113)"><circle cx="182" cy="224" r="205" fill="#080706" stroke="#D4AF37" stroke-opacity=".22"/><circle cx="182" cy="224" r="188" fill="none" stroke="#8D6B28" stroke-opacity=".55" stroke-dasharray="7 10"><animateTransform attributeName="transform" type="rotate" from="0 182 224" to="360 182 224" dur="22s" repeatCount="indefinite"/></circle><image x="72" y="18" width="220" height="410" preserveAspectRatio="xMidYMid meet" href="data:image/webp;base64,"/><circle cx="182" cy="20" r="6" fill="#D4AF37" filter="url(#glow)"><animate attributeName="r" values="4;9;4" dur="1.8s" repeatCount="indefinite"/></circle><path d="M182 4V-32M166 -17L182 -34L198 -17" stroke="#F0D27A" stroke-width="4" fill="none"/></g><text x="1140" y="150" fill="#D4AF37" font-size="11" letter-spacing="3">BUILD SIGNAL</text><text x="1140" y="182" fill="#F5F1E8" font-size="26" font-weight="700">IDEAS → SYSTEMS</text><text x="1140" y="214" fill="#AAA08E" font-size="12">code · intelligence · products</text><path d="M1140 238H1496" stroke="#3B3020"/><text x="1140" y="274" fill="#D4AF37" font-size="12">$ ./ship</text><text x="1215" y="274" fill="#F5F1E8" font-size="12">continuously improving</text><text x="1140" y="312" fill="#8B1E1E" font-size="11">●</text><text x="1158" y="312" fill="#C8BDA9" font-size="11">runtime synchronized</text><text x="60" y="573" fill="#6F6558" font-size="9" letter-spacing="2">AMRRISH / CREATIVE DEV WORKSTATION / 2026</text><text x="1538" y="573" text-anchor="end" fill="#D4AF37" font-size="9"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>● ONLINE</text></g></svg>