<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="t d">
<title id="t">Amrrish Roshan — animated cyberpunk developer workstation</title>
<desc id="d">Colorful animated cyberpunk developer workstation for a full-stack developer and AI builder.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#040516"><animate attributeName="stop-color" values="#040516;#18002d;#040516" dur="8s" repeatCount="indefinite"/></stop><stop offset=".48" stop-color="#07132b"><animate attributeName="stop-color" values="#07132b;#00283b;#07132b" dur="7s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#170018"><animate attributeName="stop-color" values="#170018;#2c0029;#170018" dur="10s" repeatCount="indefinite"/></stop></linearGradient>
<linearGradient id="neon" x1="0" x2="1"><stop stop-color="#00f5ff"><animate attributeName="stop-color" values="#00f5ff;#ff36f4;#00f5ff" dur="7s" repeatCount="indefinite"/></stop><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#00ff9d"><animate attributeName="stop-color" values="#00ff9d;#00e5ff;#00ff9d" dur="8s" repeatCount="indefinite"/></stop></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".08"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
