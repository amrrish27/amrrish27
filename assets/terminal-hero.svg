<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="t d">
<title id="t">Amrrish Roshan — Black Bulls inspired developer workstation</title><desc id="d">A premium black, gold and crimson animated developer workstation.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030303"><animate attributeName="stop-color" values="#030303;#0d0a05;#030303" dur="9s" repeatCount="indefinite"/></stop><stop offset=".5" stop-color="#120e08"/><stop offset="1" stop-color="#050303"/></linearGradient>
