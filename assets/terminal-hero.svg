<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Amrrish Roshan — cyberpunk security research workstation</title>
<desc id="desc">A colorful cyberpunk terminal workstation themed around cybersecurity, AI and full-stack engineering.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070014"><animate attributeName="stop-color" values="#070014;#12002b;#070014" dur="8s" repeatCount="indefinite"/></stop><stop offset=".52" stop-color="#041c22"><animate attributeName="stop-color" values="#041c22;#07152d;#041c22" dur="7s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#120019"><animate attributeName="stop-color" values="#120019;#250020;#120019" dur="9s" repeatCount="indefinite"/></stop></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00ff9d"/><stop offset=".45" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff36f4"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ff36f4"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7c3aed" stroke-opacity=".10"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3H1200" stroke="#fff" stroke-opacity=".025"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
