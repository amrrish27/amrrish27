<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="Amrrish Roshan Kali command center">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#D4AF37" opacity="0.04"/></pattern>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#7B5716"/><stop offset=".5" stop-color="#F2D27A"><animate attributeName="stop-color" values="#D4AF37;#FFF0B0;#D4AF37" dur="4.8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#9E7626"/></linearGradient>
    <radialGradient id="core" cx="50%" cy="42%"><stop offset="0" stop-color="#201807"/><stop offset=".62" stop-color="#080706"/><stop offset="1" stop-color="#030303"/></radialGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#D4AF37" stop-opacity="0"/><stop offset=".5" stop-color="#D4AF37" stop-opacity=".78"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="458" rx="16" fill="#060606" stroke="#3A2C12" stroke-width="1.5"/>
  <rect x="1" y="1" width="898" height="44" rx="16" fill="#0D0D0C"/><rect x="1" y="31" width="898" height="14" fill="#0D0D0C"/>
