<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" role="img" aria-labelledby="t d">
<title id="t">Amrrish Roshan technology loadout</title>
<desc id="d">Animated technology loadout showing core frontend, backend, AI, data and tooling technologies.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"><animate attributeName="stop-color" values="#050816;#0b1025;#050816" dur="8s" repeatCount="indefinite"/></stop><stop offset=".5" stop-color="#120b25"/><stop offset="1" stop-color="#031b25"/></linearGradient>
 <linearGradient id="neon" x1="0" x2="1"><stop stop-color="#00f5ff"/><stop offset=".48" stop-color="#00ff9d"/><stop offset="1" stop-color="#ff36d6"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#7dd3fc" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1400" height="300" rx="24" fill="url(#bg)"/><rect width="1400" height="300" rx="24" fill="url(#grid)"/>
<rect x="16" y="16" width="1368" height="268" rx="20" fill="none" stroke="url(#neon)" stroke-opacity=".42"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
 <text x="42" y="45" fill="#7dd3fc" font-size="14" letter-spacing="4">LOADOUT</text>
 <text x="1358" y="45" text-anchor="end" fill="#64748b" font-size="11">CORE STACK / ONLINE</text>
 <path d="M40 58H1360" stroke="#38bdf8" stroke-opacity=".12"/>
 <text x="42" y="82" fill="#00ff9d" font-size="12">~/stack $ ./loadout --modules</text>
 <text x="1358" y="82" text-anchor="end" fill="#64748b" font-size="11">12 modules</text>

