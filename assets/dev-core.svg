  <linearGradient id="neon" x1="0" x2="1"><stop stop-color="#00ff9d"/><stop offset=".45" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff3df2"/></linearGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#7c3aed" stroke-opacity=".12"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="420" rx="28" fill="url(#bg)"/><rect width="1400" height="420" rx="28" fill="url(#grid)"/>
