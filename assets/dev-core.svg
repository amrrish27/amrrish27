<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">Amrrish Roshan developer command center</title>
<desc id="desc">Animated cyberpunk developer and AI command center visual.</desc>
<defs>
