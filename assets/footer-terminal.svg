<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
<title id="title">Amrrish Roshan cyberpunk terminal footer</title>
<desc id="desc">Animated neon terminal footer for a cybersecurity and software engineering profile.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05000f"/><stop offset=".5" stop-color="#001a24"/><stop offset="1" stop-color="#160019"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00ff9d"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff36f4"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#7c3aed" stroke-opacity=".10"/></pattern>
</defs>
<rect width="1200" height="170" rx="20" fill="url(#bg)"/><rect width="1200" height="170" rx="20" fill="url(#grid)"/>
<rect x="2" y="2" width="1196" height="166" rx="18" fill="none" stroke="url(#line)" stroke-opacity=".75"/>
<rect x="24" y="20" width="1152" height="44" rx="12" fill="#0b1020" stroke="#00e5ff" stroke-opacity=".22"/>
<circle cx="45" cy="42" r="5" fill="#ff4d67"/><circle cx="63" cy="42" r="5" fill="#ffd166"/><circle cx="81" cy="42" r="5" fill="#00ff9d"/>
<text x="105" y="47" fill="#77889b" font-family="ui-monospace,monospace" font-size="12">amrrish@kali: ~/profile</text>
<text x="24" y="94" fill="#00ff9d" font-family="ui-monospace,monospace" font-size="13">$ ./close-session</text><text x="185" y="94" fill="#d6e0eb" font-family="ui-monospace,monospace" font-size="13">knowledge synced</text><text x="382" y="94" fill="#00e5ff" font-family="ui-monospace,monospace" font-size="13">•</text><text x="400" y="94" fill="#d6e0eb" font-family="ui-monospace,monospace" font-size="13">attack surface reviewed</text><text x="640" y="94" fill="#ff36f4" font-family="ui-monospace,monospace" font-size="13">•</text><text x="658" y="94" fill="#d6e0eb" font-family="ui-monospace,monospace" font-size="13">next mission queued</text>
<text x="24" y="131" fill="#00ff9d" font-family="ui-monospace,monospace" font-size="13">$ echo</text><text x="95" y="131" fill="#ffffff" font-family="ui-monospace,monospace" font-size="16" font-weight="700" letter-spacing="2">BUILD · BREAK · DEBUG · SECURE · SHIP</text>
<text x="1175" y="131" text-anchor="end" fill="#00e5ff" font-family="ui-monospace,monospace" font-size="10" filter="url(#glow)">● CHANNEL ENCRYPTED</text>
<rect x="24" y="149" width="1152" height="2" fill="url(#line)"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/></rect>
</svg>