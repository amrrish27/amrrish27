<desc id="d">Three animated project cards for FounderFlow, Ratefluencer and Sellora AI.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#060816"/><stop offset=".5" stop-color="#130b27"/><stop offset="1" stop-color="#041d25"/></linearGradient>
 <linearGradient id="n1" x1="0" x2="1"><stop stop-color="#00f5ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff3cac"/></linearGradient>
