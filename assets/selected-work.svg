   <path d="M1050 120c45-60 90-60 135 0" fill="none" stroke="url(#n1)" stroke-width="3" opacity=".6"><animate attributeName="stroke-dasharray" values="0 180;90 90;0 180" dur="3.2s" repeatCount="indefinite"/></path>
